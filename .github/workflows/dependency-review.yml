name: GitHub Native Security Scan

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # 1. SCAN ON PUSH: Using 'npm audit' (Native GitHub/NPM check)
      # This handles the "push" events where Dependency Review doesn't run.
      - name: Run NPM Audit
        run: npm audit --audit-level=high

      # 2. SCAN ON PR: Dependency Review (Vulnerabilities + Licenses)
      # This provides the rich UI feedback inside the Pull Request.
      - name: 'Dependency Review'
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          severity-threshold: high
          # Blocks copyleft and non-commercial licenses
          deny-licenses: >-
            GPL-1.0-only, GPL-1.0-or-later, GPL-2.0-only, GPL-2.0-or-later, 
            GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, 
            LGPL-2.0-only, LGPL-2.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, 
            LGPL-3.0-only, LGPL-3.0-or-later, OSL-1.0, OSL-1.1, OSL-2.0, OSL-2.1, 
            OSL-3.0, SSPL-1.0