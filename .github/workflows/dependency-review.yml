name: GitHub Native Security Scan

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # 1. SCAN ON PUSH: Using 'npm audit' (Native GitHub/NPM check)
      # This handles the "push" events where Dependency Review doesn't run.
      - name: Run NPM Audit
        run: npm audit --audit-level=high

      # 2. SCAN ON PR: Dependency Review (Vulnerabilities + Licenses)
      # This provides the rich UI feedback inside the Pull Request.
      - name: 'Dependency Review'
        # if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          allow-licenses: MIT, ISC, BSD-3-Clause, CC0-1.0, Apache-2.0, BSD-2-Clause
          # deny-licenses: MIT