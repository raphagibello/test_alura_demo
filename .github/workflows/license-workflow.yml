name: GitHub Security & License Scan

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Replacement for Snyk/Dependency Review:
      # This performs a deep scan of your files and blocks Copyleft.
      - name: License compliance check
        uses: mikaelvesavuori/license-compliance-action@v1

      # Native security vulnerability check
      - name: Run NPM Audit
        run: npm audit --audit-level=high